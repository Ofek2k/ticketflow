<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TicketFlow · Aurora</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap');

:root{
  --ink:#0f0e1a; --mut:#6b7088; --dim:#a8acc4;
  --surface:#ffffff; --bg:#f5f3ff;
  --p1:#c4b5fd; --p2:#a78bfa; --p3:#8b5cf6;
  --pink:#f472b6; --pink-d:#ec4899;
  --cyan:#22d3ee; --green:#10b981; --orange:#fb923c; --red:#ef4444; --amber:#f59e0b;
  --line:#ece9f7;
  --grad:linear-gradient(135deg,#a78bfa 0%,#f472b6 100%);
  --shadow-1:0 8px 28px -10px rgba(139,92,246,.22);
  --shadow-2:0 18px 44px -12px rgba(139,92,246,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font:15px/1.55 Heebo,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg)}
body{
  background:
    radial-gradient(900px 600px at -10% 0%, rgba(167,139,250,.35), transparent 55%),
    radial-gradient(700px 600px at 100% 30%, rgba(244,114,182,.3), transparent 55%),
    radial-gradient(600px 600px at 50% 100%, rgba(34,211,238,.25), transparent 55%),
    var(--bg);
  min-height:100vh;
  background-attachment:fixed;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ── APP LAYOUT ── */
.app{max-width:1480px;margin:0 auto;padding:18px;display:grid;grid-template-columns:240px 1fr;gap:18px;min-height:100vh}
@media (max-width:900px){.app{grid-template-columns:1fr;padding:12px;padding-bottom:90px}}

/* ── SIDEBAR ── */
.side{position:sticky;top:18px;align-self:start;background:rgba(255,255,255,.78);backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-1);
  border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:4px;height:calc(100vh - 36px);overflow-y:auto}
@media (max-width:900px){
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;border-radius:24px 24px 0 0;
    flex-direction:row;align-items:center;justify-content:space-around;gap:4px;padding:8px;z-index:9000;
    background:rgba(255,255,255,.92);max-width:none;border-bottom:0}
  .side .brand,.side .nav-divider,.side .side-foot,.side .nav-link .badge,.side .nav-link span:not(.ic){display:none}
  .side .nav-link{flex-direction:column;gap:2px;padding:8px 6px;font-size:10px;min-height:auto;flex:1}
  .side .nav-link.on{background:linear-gradient(135deg,rgba(167,139,250,.2),rgba(244,114,182,.15));color:var(--p3);
    box-shadow:none}
  .side .nav-link.mobile-label{font-size:10px;font-weight:700;display:flex !important;color:inherit}
}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand .logo{width:38px;height:38px;border-radius:12px;
  background:conic-gradient(from 220deg,#a78bfa,#f472b6,#22d3ee,#a78bfa);
  box-shadow:0 8px 22px -4px rgba(139,92,246,.5)}
.brand b{font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500;margin-top:2px}
.nav-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--mut);
  font-size:13.5px;font-weight:600;min-height:42px;transition:.18s;cursor:pointer;border:1px solid transparent}
.nav-link:hover{background:rgba(167,139,250,.08);color:var(--ink)}
.nav-link.on{background:var(--grad);color:#fff;box-shadow:0 8px 22px -6px rgba(167,139,250,.6)}
.nav-link .ic{width:18px;height:18px;display:grid;place-items:center;flex-shrink:0}
.nav-link .ic svg{width:18px;height:18px}
.nav-link .badge-pill{margin-right:auto;font-size:10.5px;background:#fff;color:var(--p3);padding:2px 8px;border-radius:999px;font-weight:700}
.nav-link.on .badge-pill{background:rgba(255,255,255,.25);color:#fff}
.nav-divider{font-size:10px;letter-spacing:.18em;color:var(--dim);padding:14px 10px 6px;font-weight:700;text-transform:uppercase}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:12.5px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);flex-shrink:0;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 4px 12px -2px rgba(167,139,250,.5)}
.logout-mini{margin-right:auto;background:none;border:0;color:var(--mut);padding:6px;border-radius:8px;cursor:pointer}
.logout-mini:hover{color:#dc2626;background:rgba(239,68,68,.08)}

/* ── MAIN ── */
main{display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{background:rgba(255,255,255,.6);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.8);
  border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-1)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;min-height:42px;flex-direction:row-reverse}
.search:focus-within{border-color:var(--p3);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.search input{flex:1;background:none;border:0;outline:0;color:inherit;font-size:14px;text-align:right}
.kbd{font-size:10.5px;color:var(--mut);background:var(--bg);padding:3px 7px;border-radius:5px;font-family:ui-monospace,monospace;border:1px solid var(--line)}
.iconbtn{width:42px;height:42px;border-radius:11px;background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--mut);position:relative;transition:.15s;cursor:pointer}
.iconbtn:hover{color:var(--p3);border-color:var(--p3)}
.iconbtn .ping{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.add-btn{background:var(--grad);color:#fff;padding:0 18px;height:42px;border-radius:12px;
  font-weight:700;display:flex;align-items:center;gap:8px;font-size:13.5px;box-shadow:0 8px 22px -4px rgba(167,139,250,.55);border:0;cursor:pointer}
.add-btn:hover{transform:translateY(-2px)}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.section-head h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.025em}
.section-head h1 .grad{background:linear-gradient(135deg,#a78bfa,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.section-head p{margin:4px 0 0;color:var(--mut);font-size:14px}
.section-head .meta{display:flex;gap:8px;font-size:12px;flex-wrap:wrap}
.section-head .meta span{padding:6px 11px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-weight:500}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--cyan)!important;background:rgba(34,211,238,.1)!important;border-color:rgba(34,211,238,.3)!important}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}

/* ── BENTO ── */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;grid-auto-rows:minmax(120px,auto)}
@media (max-width:900px){
  .bento{grid-template-columns:repeat(2,1fr);gap:10px}
  .bento .t-hero{grid-column:1/-1;grid-row:auto;min-height:auto;padding:18px}
  .bento .t-hero h2{font-size:22px;max-width:none}
  .bento .t-hero .row{gap:14px}
  .bento .t-hero .row > div{font-size:11.5px}
  .bento .t-hero .row b{font-size:14px}
  .bento .t-stat{grid-column:span 1}
  .bento .t-stat .big{font-size:28px}
  .bento .t-stat .spark{display:none}
  .bento .t-list{grid-column:1/-1}
  .bento .t-list .ev{grid-template-columns:auto 1fr auto;gap:8px;padding:10px}
  .bento .t-list .ev .num-box,.bento .t-list .ev .tag,.bento .t-list .ev .time{display:none}
}
.tile{background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:20px;
  position:relative;overflow:hidden;transition:.2s;box-shadow:var(--shadow-1)}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.tile h3{font-size:15.5px;font-weight:700;margin:0}
.tile .lbl{font-size:11px;color:var(--mut);letter-spacing:.1em;font-weight:700;text-transform:uppercase}

/* hero tile */
.t-hero{grid-column:span 4;grid-row:span 2;
  background:linear-gradient(135deg,#a78bfa 0%,#c084fc 35%,#f472b6 70%,#fb7185 100%);
  color:#fff;min-height:240px;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 24px 60px -14px rgba(167,139,250,.55);cursor:pointer}
.t-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 0% 0%, rgba(255,255,255,.4), transparent 50%);pointer-events:none}
.t-hero::after{content:"";position:absolute;right:-100px;top:-100px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,211,238,.45),transparent 70%);pointer-events:none}
.t-hero .lbl{color:rgba(255,255,255,.9)!important;position:relative;font-weight:800}
.t-hero h2{font-size:30px;font-weight:800;margin:0;letter-spacing:-.03em;line-height:1.1;max-width:18ch;position:relative}
.t-hero .row{display:flex;gap:24px;align-items:center;flex-wrap:wrap;position:relative}
.t-hero .row > div{font-size:12.5px;color:rgba(255,255,255,.8)}
.t-hero .row b{display:block;color:#fff;font-weight:700;font-size:16px;margin-bottom:2px;letter-spacing:-.01em}
.t-hero .cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);
  padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;align-self:flex-start;
  min-height:44px;position:relative;transition:.2s;box-shadow:0 10px 24px -6px rgba(0,0,0,.18);border:0;cursor:pointer}
.t-hero .cta:hover{transform:translateY(-2px)}
.t-hero-empty{background:linear-gradient(135deg,#34d399,#10b981 60%,#06b6d4)!important}

/* stat tiles */
.t-stat{grid-column:span 2;display:flex;flex-direction:column;gap:8px}
.t-stat .big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1;font-feature-settings:"tnum"}
.t-stat .delta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:2px;padding:3px 9px;border-radius:999px;align-self:flex-start}
.delta.up{background:rgba(244,114,182,.12);color:#db2777}
.delta.down{background:rgba(16,185,129,.12);color:#059669}
.delta.warn{background:rgba(244,63,94,.12);color:#dc2626}
.delta.flat{background:rgba(148,163,184,.12);color:#6b7088}
.spark{height:34px;margin-top:auto}
.spark svg{width:100%;height:100%}
.t-stat.violet{background:linear-gradient(135deg,#f5f3ff,#fff)}
.t-stat.violet .big{background:linear-gradient(135deg,#8b5cf6,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-stat.pink{background:linear-gradient(135deg,#fdf2f8,#fff)}
.t-stat.pink .big{background:linear-gradient(135deg,#ec4899,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-stat.cyan{background:linear-gradient(135deg,#ecfeff,#fff)}
.t-stat.cyan .big{background:linear-gradient(135deg,#06b6d4,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-stat.green{background:linear-gradient(135deg,#ecfdf5,#fff)}
.t-stat.green .big{background:linear-gradient(135deg,#10b981,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-stat.red{background:linear-gradient(135deg,#fef2f2,#fff)}
.t-stat.red .big{background:linear-gradient(135deg,#ef4444,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}

/* list tile */
.t-list{grid-column:span 6}
.ev-list{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:56px 1fr auto auto auto;gap:14px;align-items:center;padding:14px;
  border-radius:14px;background:#fafafe;border:1px solid var(--line);transition:.15s;cursor:pointer}
.ev:hover{background:#fff;border-color:var(--p3);box-shadow:0 8px 22px -8px rgba(139,92,246,.25);transform:translateX(-2px)}
.ev.hot{background:linear-gradient(135deg,#fef2f2,#fff);border-color:rgba(244,63,94,.3)}
.ev .num-box{text-align:center;background:#fff;border-radius:10px;padding:10px 6px;border:1px solid var(--line);font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);font-weight:700}
.ev .t{min-width:0}
.ev .t b{display:block;font-size:14.5px;font-weight:700;margin-bottom:2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t span{font-size:12.5px;color:var(--mut)}
.ev .tag{font-size:11px;padding:5px 10px;border-radius:999px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.tag-amts,.tag-tk{background:rgba(34,211,238,.15);color:#0891b2}
.tag-mch{background:rgba(167,139,250,.15);color:#7c3aed}
.tag-tks{background:rgba(251,146,60,.15);color:#ea580c}
.tag-pwr{background:rgba(251,191,36,.18);color:#b45309}
.tag-default{background:rgba(148,163,184,.15);color:#475569}
.ev .time{font-size:11.5px;color:var(--mut);font-feature-settings:"tnum"}
@media (max-width:900px){
  .ev{grid-template-columns:auto 1fr auto;gap:10px;padding:12px}
  .ev .tag,.ev .time{display:none}
}

/* badge */
.badge{font-size:11px;padding:5px 11px;border-radius:999px;font-weight:700;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.badge.OPEN{background:rgba(96,165,250,.12);color:#2563eb;border-color:rgba(96,165,250,.3)}
.badge.IN_PROGRESS{background:rgba(251,191,36,.18);color:#b45309;border-color:rgba(251,191,36,.35)}
.badge.RESOLVED{background:rgba(16,185,129,.15);color:#059669;border-color:rgba(16,185,129,.3)}
.badge.CLOSED{background:var(--bg);color:var(--mut)}
.badge.HAMAL{background:rgba(239,68,68,.12);color:#dc2626;border-color:rgba(239,68,68,.3);animation:pulse 1.6s infinite}

/* filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f-search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:42px;flex-direction:row-reverse}
.f-search input{flex:1;background:none;border:0;outline:0;font-size:13.5px;text-align:right}
.select{padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:13px;min-height:42px;cursor:pointer}
.chip{padding:9px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--mut);min-height:38px;cursor:pointer;font-weight:600}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -4px rgba(167,139,250,.5)}

/* table */
.tbl{padding:0;overflow:hidden}
.tbl-head{display:grid;grid-template-columns:80px 1fr 110px 110px 100px 90px;gap:14px;padding:14px 18px;background:var(--bg);font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
@media (max-width:900px){.tbl-head{grid-template-columns:60px 1fr 90px;gap:10px;padding:12px}.tbl-head .col-hide{display:none}}
.tbl-row{display:grid;grid-template-columns:80px 1fr 110px 110px 100px 90px;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;transition:.15s}
@media (max-width:900px){.tbl-row{grid-template-columns:60px 1fr 90px;gap:10px;padding:14px}.tbl-row .col-hide{display:none}}
.tbl-row:last-child{border:0}
.tbl-row:hover{background:#fafafe}
.tbl-row.hot{background:linear-gradient(135deg,#fef2f2,transparent);border-right:3px solid var(--red)}
.tn{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--mut);font-feature-settings:"tnum"}
.tt{min-width:0}
.tt b{display:block;font-weight:700;font-size:14.5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--mut);font-size:12.5px}

/* detail */
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{padding:28px;background:#fff;border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow-1)}
.card h2{margin:0 0 4px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.meta-line{color:var(--mut);font-size:13.5px;margin-bottom:22px}
.desc{font-size:15px;line-height:1.7;color:#3a3a4d;padding:18px 20px;
  background:linear-gradient(135deg,rgba(167,139,250,.06),rgba(244,114,182,.04));
  border-radius:14px;margin-bottom:24px;border:1px solid rgba(167,139,250,.15);white-space:pre-wrap}

.timeline{padding:0;margin:0;list-style:none}
.tl-item{position:relative;padding:0 22px 22px 0;border-right:2px solid var(--line)}
.tl-item::before{content:"";position:absolute;right:-7px;top:6px;width:12px;height:12px;border-radius:50%;
  background:var(--grad);box-shadow:0 0 12px rgba(167,139,250,.5),0 0 0 4px #fff}
.tl-item:last-child{border-color:transparent;padding-bottom:0}
.tl-item time{font-size:11.5px;color:var(--mut);font-feature-settings:"tnum"}
.tl-item b{display:block;margin-top:2px;font-size:14px;font-weight:700}
.tl-item p{margin:3px 0 0;font-size:12.5px;color:var(--mut)}

/* meta grid (detail sidebar) */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.meta-cell{padding:16px;background:#fff;border:1px solid var(--line);border-radius:14px;transition:.18s}
.meta-cell:hover{border-color:var(--p3);transform:translateY(-1px);box-shadow:0 6px 18px -6px rgba(139,92,246,.2)}
.meta-cell .lbl{font-size:10.5px;color:var(--mut);letter-spacing:.08em;font-weight:700;margin-bottom:6px;text-transform:uppercase}
.meta-cell b{font-size:15px;font-weight:700;display:block}
.meta-cell small{color:var(--mut);font-size:11.5px;display:block;margin-top:2px}
.meta-cell.urgent{background:linear-gradient(135deg,#fef2f2,#fff);border-color:rgba(244,63,94,.3)}
.meta-cell.urgent b{color:var(--red)}

/* form */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:7px;letter-spacing:.02em}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;background:#fafafe;border:1px solid var(--line);
  border-radius:12px;color:var(--ink);font-size:14.5px;min-height:48px;transition:.15s;outline:0}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--p3);background:#fff;box-shadow:0 0 0 4px rgba(167,139,250,.15)}
.field textarea{min-height:120px;resize:vertical;font-family:inherit}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.field-row{grid-template-columns:1fr}}
.toggle{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(135deg,rgba(244,63,94,.08),rgba(244,114,182,.04));
  border:1px solid rgba(244,63,94,.25);border-radius:14px;margin-bottom:20px;cursor:pointer}
.toggle b{color:var(--red);font-weight:700;display:block;font-size:14.5px}
.toggle small{color:var(--mut);font-size:12.5px}
.toggle input{margin-right:auto;width:44px;height:26px;appearance:none;background:#fff;border:1px solid var(--line);border-radius:999px;position:relative;cursor:pointer;flex-shrink:0;transition:.18s}
.toggle input:checked{background:linear-gradient(135deg,#ef4444,#f472b6);border-color:transparent}
.toggle input::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toggle input:checked::after{right:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--grad);color:#fff;
  padding:13px 22px;border-radius:14px;font-weight:700;min-height:48px;font-size:14.5px;
  box-shadow:0 10px 24px -6px rgba(167,139,250,.5);transition:.2s;border:0;cursor:pointer}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px -6px rgba(167,139,250,.65)}

/* ── DATA LOADERS ── */
async function loadData(){
  const { data:{ user } } = await supabase.auth.getUser();
  if(!user) return null;
  const [uRes, tRes, unRes] = await Promise.all([
    supabase.from('users').select('*'),
    supabase.from('tickets').select('*').order('created_at',{ascending:false}).limit(150),
    supabase.from('units').select('*')
  ]);
  if(uRes.error) throw uRes.error;
  users = (uRes.data||[]).map(u => {
    let settings={}; try{ settings = typeof u.settings==='string'?JSON.parse(u.settings):(u.settings||{}); }catch(e){}
    let unit=[]; if(Array.isArray(u.unit)) unit=u.unit.map(x=>String(x).trim());
    else if(typeof u.unit==='string'){ if(u.unit.startsWith('[')){ try{ unit=JSON.parse(u.unit).map(x=>String(x).trim()); }catch(e){ unit=[u.unit.trim()]; } } else unit=[u.unit.trim()]; }
    else if(u.unit) unit=[String(u.unit).trim()];
    return { id:u.id, authUserId:u.auth_user_id, fullName:u.full_name, email:u.email, phone:u.phone, role:u.role, isManager:u.is_manager, requestedManager:u.requested_manager, unit, unitId:u.unit_id||null, requestedRole:u.requested_role, roleStatus:u.role_status, isFrozen:u.is_frozen, settings };
  });
  tickets = (tRes.data||[]).map(t => ({ id:t.id, ticketNumber:t.ticket_number, title:t.title, description:t.description, topic:t.topic, unit:String(t.unit||'').trim(), status:t.status, assignedRole:t.assigned_role, createdByUserId:t.created_by_user_id, createdByName:t.created_by_name, forwardedByHatapName:t.forwarded_by_hatap_name, createdAt:t.created_at, isClosed:!!t.is_closed, isHamalDown:!!t.is_hamal_down, isBumped:!!t.is_bumped, bumpCount:t.bump_count, attachments:Array.isArray(t.attachments)?t.attachments:[], recurringOf:t.recurring_of||null }));
  units = unRes.data||[];
  currentUser = users.find(u => u.authUserId===user.id);
  if(currentUser && currentUser.isFrozen){ await supabase.auth.signOut(); alert('החשבון שלך הוקפא.'); window.location.reload(); return null; }
  return currentUser;
}
async function loadComments(ticketId){
  const { data } = await supabase.from('ticket_comments').select('*').eq('ticket_id', ticketId).order('created_at',{ascending:true});
  comments = (data||[]).map(c => ({ id:c.id, ticketId:c.ticket_id, content:c.content, authorName:c.author_name, authorRole:c.author_role, createdAt:c.created_at }));
}
function getExpandedUnits(base){
  const sub = units.filter(u => u.parent_unit && base.includes(u.parent_unit)).map(u => u.name);
  return [...new Set([...base, ...sub])];
}
async function getNextNum(){
  const { data } = await supabase.from('tickets').select('ticket_number').order('ticket_number',{ascending:false}).limit(1);
  return (data && data[0] ? data[0].ticket_number : 1000) + 1;
}

/* Insert a ticket with race-safe ticket_number assignment.
   Requires a UNIQUE constraint on tickets.ticket_number (see SQL_FIXES.md).
   On duplicate-key conflict, retries with +1 up to 8 times. */
async function insertTicketSafe(payload){
  let num = await getNextNum();
  for(let attempt=0; attempt<8; attempt++){
    const { data, error } = await supabase.from('tickets')
      .insert({ ...payload, ticket_number: num })
      .select().single();
    if(!error) return { data, error: null };
    // Postgres unique_violation code is 23505
    const isDup = error.code==='23505' || /duplicate|unique/i.test(error.message||'');
    if(!isDup) return { data: null, error };
    num++;  // try next number
  }
  return { data: null, error: new Error('Could not assign unique ticket_number after 8 retries') };
}

    if(activePage==='DETAILS' && selectedTicketId && String(payload.new.ticket_id)===String(selectedTicketId)){

}

/* Returns the list of pending users that `me` is allowed to approve.
   OWNER sees everything. A role-manager (e.g. HR manager) sees only requests
   for their own role and "be a manager" requests already in their role. */
function pendingApprovableBy(me){
  const isOwner = me.role==='OWNER';
  return users.filter(u => {
    if(u.id === me.id) return false;
    // Skip users who never completed onboarding — no name = nothing to approve
    if(!u.fullName || !String(u.fullName).trim()) return false;
    const hasReq = u.roleStatus==='Pending' || u.requestedRole || u.requestedManager;
    if(!hasReq) return false;
    if(isOwner) return true;
    if(!me.isManager) return false;
    const targetRole = u.requestedRole || u.role;
    return targetRole === me.role;
  });
}
function incompleteOnboardingUsers(){
  return users.filter(u => !u.fullName || !String(u.fullName).trim());
}
function canApproveRoles(me){
  if(me.role==='OWNER') return true;
  return !!me.isManager;
}

function renderPage(){

  // ── permission guards (defense in depth; server-side RLS is the source of truth) ──
  const isOwner = currentUser.role==='OWNER';

  const PAGE_REQ = {
    HOME:          () => isManager,

    NOTIFICATIONS: () => isManager,

function sparkSvg(color, gid){
  const path = Array.from({length:8}, (_,i) => `${i*14},${10+Math.floor(Math.random()*16)}`).join(' L');

    <path d="M${path}" stroke="${color}" stroke-width="2" fill="none"/>
    <path d="M${path} L100 30 L0 30 Z" fill="url(#${gid})" opacity=".35"/>
  </svg></div>`;
}

  if(step===1){ if(!createData.topic) return toast('בחר נושא','alert-circle'); }

    const uEl = document.getElementById('wu');
    const userUnits = getExpandedUnits(Array.isArray(currentUser.unit)?currentUser.unit:(currentUser.unit?[currentUser.unit]:[]));

window.wsubmit = async btn => {
  let title = (document.getElementById('wt').value || '').replace(/\s+/g,' ').trim();
  let desc  = (document.getElementById('wd').value || '').trim();
  if(!title) return toast('הכנס כותרת','alert-circle');
  if(title.length > 200) title = title.slice(0,200);
  if(desc.length > 5000) desc = desc.slice(0,5000);
  await withBtnLoader(btn, async ()=>{
    const files = document.getElementById('wf').files;
    const attachments = [];
    if(files && files.length){
      for(const f of files){
        const ext = f.name.split('.').pop();
        const fn = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
        const { data:up, error:upErr } = await supabase.storage.from('attachments').upload(fn, f);
        if(!upErr){
          const { data:urlData } = supabase.storage.from('attachments').getPublicUrl(up.path);
          attachments.push({ url:urlData.publicUrl, type:f.type, name:f.name });
        }
      }
    }
    const payload = {
      title, description:desc, topic:createData.topic||'אחר',
      unit:createData.unit, assigned_role:createData.role,
      status:'OPEN', is_hamal_down:!!createData.hamalDown,
      created_by_user_id:currentUser.id, created_by_name:currentUser.fullName,
      attachments
    };
    if(currentUser.role==='HATAP' && payload.assigned_role==='HR') payload.forwarded_by_hatap_name = currentUser.fullName;
    const { data:t, error } = await insertTicketSafe(payload);
    if(error) throw error;
    await loadData();
    toast('התקלה נפתחה!','check-circle');
    nav('DETAILS', t.id);
  });
};

/* ── NOTIFICATIONS ── */
function renderNotifications(main){
  // Build a list of "interesting" events from current tickets state:
  // 1. New tickets (last 24h)
  // 2. Hamal-down tickets that are still open
  // 3. Tickets over SLA (>60min open)
  // 4. Pending role-approval requests (for users I can approve)
  const now = Date.now();
  const items = [];

  tickets.filter(t => t.isHamalDown && !t.isClosed).forEach(t => {
    items.push({
      type:'hamal', icon:'alert-triangle', color:'#ef4444',
      title:`🚨 חמ"ל מושבת — ${esc(t.title)}`,
      meta:`#${t.ticketNumber} · ${esc(t.unit||'-')} · ${esc(roleLabel(t.assignedRole))}`,
      time: new Date(t.createdAt).getTime(),
      onClick: `nav('DETAILS',${t.id})`
    });
  });

  tickets.filter(t => !t.isClosed && !t.isHamalDown && (now - new Date(t.createdAt)) > 3600000).forEach(t => {
    items.push({
      type:'overdue', icon:'clock', color:'#f59e0b',
      title:`⏱ תקלה חורגת — ${esc(t.title)}`,
      meta:`#${t.ticketNumber} · פתוחה ${elapsedStr(t.createdAt)} · ${esc(roleLabel(t.assignedRole))}`,
      time: new Date(t.createdAt).getTime(),
      onClick: `nav('DETAILS',${t.id})`
    });
  });

  tickets.filter(t => (now - new Date(t.createdAt)) < 86400000).forEach(t => {
    items.push({
      type:'new', icon:'plus-circle', color:'#10b981',
      title:`✨ תקלה חדשה — ${esc(t.title)}`,
      meta:`#${t.ticketNumber} · ${esc(t.createdByName||'-')} · ${esc(t.unit||'-')}`,
      time: new Date(t.createdAt).getTime(),
      onClick: `nav('DETAILS',${t.id})`
    });
  });

  pendingApprovableBy(currentUser).forEach(u => {
    items.push({
      type:'role', icon:'shield-check', color:'#8b5cf6',
      title:`🛡️ בקשת אישור תפקיד — ${esc(u.fullName)}`,
      meta:`${esc(u.email||'')} · מבקש ${roleLabel(u.requestedRole||u.role)}${u.requestedManager?' · להיות מפקד':''}`,
      time: now,
      onClick: `nav('ROLE_APPROVAL')`
    });
  });

  // de-dupe (a new hamal ticket appears in both "hamal" and "new") — keep highest priority
  const dedup = new Map();
  const priority = { hamal:4, overdue:3, role:2, new:1 };
  items.forEach(it => {
    const key = `${it.type}-${it.title}`;
    if(!dedup.has(key) || priority[it.type] > priority[dedup.get(key).type]) dedup.set(key, it);
  });
  const list = [...dedup.values()].sort((a,b) => (priority[b.type]-priority[a.type]) || (b.time-a.time));

  const groupCount = { hamal:0, overdue:0, role:0, new:0 };
  list.forEach(it => groupCount[it.type]++);

  main.innerHTML = `
    ${topbar()}
    <div class="section-head">
      <div><h1>מרכז <span class="grad">התראות</span></h1><p>${list.length} פריטים דורשים תשומת לב</p></div>
      <div class="meta">
        ${groupCount.hamal?`<span style="color:#dc2626;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3)">🚨 חמ"ל: ${groupCount.hamal}</span>`:''}
        ${groupCount.overdue?`<span style="color:#b45309;background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.3)">⏱ חורגות: ${groupCount.overdue}</span>`:''}
        ${groupCount.role?`<span style="color:#7c3aed;background:rgba(139,92,246,.12);border-color:rgba(139,92,246,.3)">🛡️ אישורים: ${groupCount.role}</span>`:''}
        ${groupCount.new?`<span style="color:#059669;background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.3)">✨ חדשות 24ש: ${groupCount.new}</span>`:''}
      </div>
    </div>

    ${list.length===0 ? '<div class="empty"><h3>אין התראות פעילות</h3><p>שקט מבצעי 🎉</p></div>'
      : `<div class="tile" style="padding:8px"><div style="display:flex;flex-direction:column;gap:6px">${list.map(it => `
          <div onclick="${it.onClick}" style="display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fafafe;cursor:pointer;transition:.15s" onmouseover="this.style.background='#fff';this.style.borderColor='${it.color}'" onmouseout="this.style.background='#fafafe';this.style.borderColor='var(--line)'">
            <div style="width:42px;height:42px;border-radius:11px;background:${it.color}1a;color:${it.color};display:grid;place-items:center;flex-shrink:0"><i data-lucide="${it.icon}" style="width:20px;height:20px"></i></div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.title}</div>
              <div style="font-size:12.5px;color:var(--mut);margin-top:2px">${it.meta}</div>
            </div>
            <span style="font-size:11.5px;color:var(--mut);font-feature-settings:'tnum'">${it.type==='role'?'עכשיו':timeAgo(new Date(it.time))}</span>
          </div>`).join('')}</div></div>`}

    <div class="card" style="margin-top:18px">
      <h3 style="margin:0 0 12px;font-size:15px">הגדרות התראות</h3>
      <label style="display:flex;align-items:center;gap:12px;padding:12px;background:#fafafe;border-radius:12px;cursor:pointer">
        <input type="checkbox" id="notif-overdue" ${(currentUser.settings||{}).notifyOverdue?'checked':''} onchange="updateNotifSetting('notifyOverdue',this.checked)" style="width:18px;height:18px"/>
        <div style="flex:1"><b style="font-size:13.5px">התרעה על תקלות חורגות זמן</b><div style="font-size:12px;color:var(--mut);margin-top:2px">תקבל הודעת דפדפן על כל תקלה שפתוחה מעל הסף שתגדיר</div></div>
      </label>
      <div style="margin-top:10px;padding:12px;background:#fafafe;border-radius:12px;display:flex;align-items:center;gap:12px">
        <label style="font-size:13.5px;font-weight:600">סף חריגה (דקות):</label>
        <input type="number" id="notif-time" value="${(currentUser.settings||{}).overdueTime||60}" min="5" max="1440" onchange="updateNotifSetting('overdueTime',parseInt(this.value)||60)" style="width:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px"/>
      </div>
      <button class="btn btn-ghost" style="margin-top:12px" onclick="requestNotifPermission(this)">
        <i data-lucide="bell"></i> הפעל הודעות דפדפן
      </button>
    </div>
  `;
  if(window.lucide) lucide.createIcons();
}

    </div>
  `;
  if(window.lucide) lucide.createIcons();
}
window.toggleFreeze = async (id, freeze) => {
  await supabase.from('users').update({ is_frozen:freeze }).eq('id', id);
  await loadData(); render(); toast(freeze?'המשתמש הוקפא':'הוקפא בוטל','check');
};

/* ── ROLE APPROVAL ── */
function renderRoleApproval(main){
  if(!canApproveRoles(currentUser)){ nav('HOME'); return; }
  const pending = pendingApprovableBy(currentUser);
  const incomplete = currentUser.role==='OWNER' ? incompleteOnboardingUsers() : [];
  const scopeNote = currentUser.role==='OWNER'
    ? 'אתה רואה את כל הבקשות (בעלים)'
    : `אתה רואה בקשות לתפקיד ${roleLabel(currentUser.role)} בלבד`;
  main.innerHTML = `
    ${topbar()}
    <div class="section-head"><div><h1>אישורי <span class="grad">תפקיד</span></h1><p>${pending.length} בקשות ממתינות · ${scopeNote}</p></div></div>
    ${pending.length===0 ? '<div class="empty"><h3>אין בקשות ממתינות</h3><p>הכל מסודר.</p></div>'
      : pending.map(u => {
        const targetRole = u.requestedRole || u.role;
        const targetRoleStr = JSON.stringify(targetRole).replace(/"/g,'&quot;');
        return `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div class="avatar">${avatarChar(u.fullName)}</div>
        <div style="flex:1;min-width:200px">
          <b>${esc(u.fullName||'-')}</b><br><small class="muted">${esc(u.email||'')} · נוכחי: ${roleLabel(u.role)}${u.requestedRole?` → מבקש: <b style="color:var(--p3)">${roleLabel(u.requestedRole)}</b>`:''}${u.requestedManager?' · <b style="color:var(--p3)">מבקש להיות מפקד</b>':''}</small>
        </div>
        <button class="btn btn-ok" onclick="approveUser('${u.id}',${targetRoleStr},${!!u.requestedManager})">אשר</button>
        <button class="btn btn-ghost" onclick="rejectUser('${u.id}')">דחה</button>
      </div>`;}).join('')}

    ${incomplete.length ? `
      <div class="section-head" style="margin-top:32px"><div><h1 style="font-size:20px">השלמת <span class="grad">פרופיל</span></h1><p>${incomplete.length} משתמשים נרשמו אך לא השלימו פרטים</p></div></div>
      ${incomplete.map(u => `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;opacity:.85">
        <div class="avatar">?</div>
        <div style="flex:1;min-width:200px"><b>(טרם השלים)</b><br><small class="muted">${esc(u.email||'-')} · נרשם ולא חזר</small></div>
        <button class="btn btn-ghost" onclick="deleteIncomplete('${u.id}')">מחק</button>
      </div>`).join('')}
    ` : ''}
  `;
  if(window.lucide) lucide.createIcons();
}
window.deleteIncomplete = async id => {
  if(!confirm('למחוק את החשבון שלא הושלם?')) return;
  const { error } = await supabase.from('users').delete().eq('id', id);
  if(error) return modal('שגיאה', error.message, true);
  await loadData(); render(); toast('החשבון נמחק','trash-2');
};
window.approveUser = async (id, role, asManager) => {
  await supabase.from('users').update({ role, is_manager:asManager, role_status:'Approved', requested_role:null, requested_manager:false }).eq('id', id);
  await loadData(); render(); toast('המשתמש אושר ✓','check');
};
window.rejectUser = async id => {
  await supabase.from('users').update({ role_status:'Rejected', requested_role:null, requested_manager:false }).eq('id', id);
  await loadData(); render(); toast('הבקשה נדחתה','x');
};

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', async () => {
  supabase.auth.onAuthStateChange((event, session) => {
    if(event==='PASSWORD_RECOVERY'){ isRecoveryMode=true; render(); }
    else if(event==='SIGNED_IN' || event==='TOKEN_REFRESHED'){
      if(!isRecoveryMode) loadData().then(() => { setupRealtime(); render(); }).catch(e => modal('שגיאה', e.message, true));
    } else if(event==='SIGNED_OUT'){ currentUser=null; render(); }
  });

  if(window.location.hash.includes('type=recovery')){ isRecoveryMode=true; render(); return; }

  const { data:{ session } } = await supabase.auth.getSession();
  if(session){
    try{
      await loadData();
      setupRealtime();
      const tp = new URLSearchParams(window.location.search).get('ticket');
      if(tp && currentUser){
        const found = tickets.find(t => String(t.ticketNumber)===String(tp));
        if(found){ activePage='DETAILS'; selectedTicketId=found.id; }
      }
    }catch(e){ modal('שגיאה', e.message, true); }
  }
  render();
});
</script>
